name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Node ${{ matrix.node }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # pi-coding-agent requires Node >= 22.19.0 (its bundled undici 8
        # uses worker_threads.markAsUncloneable, absent on Node 20).
        node: ["22", "24"]

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test
        timeout-minutes: 10
        env:
          # All matrix platforms have node-pty prebuilds; a load failure
          # must be a red build, not a silent skip of the PTY suite.
          EXPECT_PTY: "1"
